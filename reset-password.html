<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password</title>
<style>
  html, body { margin: 0; min-height: 100%; display: flex; align-items: center; justify-content: center;
               background: #0b0e14; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 20px; box-sizing: border-box; }
  .box { max-width: 360px; width: 100%; }
  h1 { font-size: 24px; margin: 0 0 12px; }
  p { opacity: .8; font-size: 15px; line-height: 1.5; }
  input { box-sizing: border-box; width: 100%; font-size: 16px; margin: 14px 0 0; padding: 14px; border-radius: 10px;
          border: 1px solid #6a85954d; background: #17232d; color: #fff; }
  button { width: 100%; margin-top: 16px; min-height: 48px; border: 0; border-radius: 10px; font: inherit; font-weight: 800;
           background: #8ee2cd; color: #0b2724; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { margin-top: 14px; font-size: 14px; color: #ffb2a6; min-height: 18px; }
  #msg.ok { color: #8ee2cd; }
</style>
</head>
<body>
<div class="box">
  <h1>Reset your password</h1>
  <p id="lead">Enter a new password below. Make up something you'll actually remember — it doesn't need to match your email password.</p>
  <form id="form">
    <input id="pass" type="password" placeholder="New password (at least 6 characters)" minlength="6" autocomplete="new-password" required>
    <button id="btn" type="submit">Set new password</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
</div>
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const supabase = createClient(
    'https://teyuiwdcqzjcvzejlsnc.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRleXVpd2RjcXpqY3Z6ZWpsc25jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1Nzg3MjcsImV4cCI6MjEwNzE1NDcyN30.fkhPyK21YxN_swhUsfZO2QbcnAdBamjNnXdgXEXOd3s'
  );
  const form = document.getElementById('form'), btn = document.getElementById('btn'), msg = document.getElementById('msg'), lead = document.getElementById('lead');
  let ready = false;
  supabase.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') ready = true; });
  // The recovery link itself establishes a session on load — give it a moment before deciding the link is bad.
  setTimeout(async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session && !ready) {
      lead.textContent = '';
      msg.textContent = "This reset link is invalid or has expired. Go back to the game and click \"Forgot password?\" again.";
      form.style.display = 'none';
    }
  }, 1200);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'Please wait…';
    const { error } = await supabase.auth.updateUser({ password: document.getElementById('pass').value });
    btn.disabled = false; btn.textContent = 'Set new password';
    if (error) { msg.textContent = error.message; msg.className = ''; return; }
    msg.textContent = 'Password updated! Close this tab and log in with it in the game.';
    msg.className = 'ok';
    form.style.display = 'none';
  });
</script>
</body>
</html>
